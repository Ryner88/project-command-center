name: Production rollback

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: Previous working deployment URL
        required: true
        type: string
      build_id:
        description: Build ID expected after rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect rollback target
        run: npx vercel@59.23.2 inspect "$DEPLOYMENT_URL" --wait --timeout 5m --token="$VERCEL_TOKEN"
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Restore previous deployment
        run: npx vercel@59.23.2 rollback "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Verify rollback
        run: npm run test:smoke
        env:
          SMOKE_BASE_URL: ${{ secrets.PRODUCTION_URL }}
          SMOKE_ACCESS_PASSWORD: ${{ secrets.PRODUCTION_ACCESS_PASSWORD }}
          EXPECTED_BUILD_ID: ${{ inputs.build_id }}
      - name: Record rollback
        run: echo "Rolled production back to ${{ inputs.deployment_url }} with build ${{ inputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
