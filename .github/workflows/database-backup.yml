name: Database backup

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check backup configuration
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: test -n "$BACKUP_DATABASE_URL"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: pg_dump --format=custom --no-owner --no-acl --file=pcc.dump "$BACKUP_DATABASE_URL"
      - name: Check dump archive
        run: pg_restore --list pcc.dump > /dev/null
      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: pcc-postgres-${{ github.run_id }}
          path: pcc.dump
          retention-days: 30
          if-no-files-found: error
