name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pcc_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pcc_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:migrations
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pcc_ci_test

  build:
    needs: [quality, migrations]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BUILD_ID: ${{ github.sha }}

  end-to-end:
    needs: [quality, migrations]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pcc_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pcc_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pcc_e2e_test
      APP_ACCESS_PASSWORD: ci-owner-password
      SESSION_SECRET: ci-session-secret
      TEST_BASE_URL: http://localhost:3106
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prisma:migrate:deploy
      - name: Start application
        run: npm run dev -- --webpack > /tmp/pcc-e2e.log 2>&1 &
        env:
          PORT: 3106
      - name: Wait for readiness
        run: timeout 60 bash -c 'until curl -fsS http://localhost:3106/api/ready; do sleep 2; done'
      - run: npm run test:e2e:phase3
      - run: npm run test:e2e:phase4
        env:
          EXPECT_SECURE_COOKIE: "false"
      - run: npm run test:e2e:phase5
        env:
          EXPECT_READINESS: ready
      - run: npm run test:e2e:phase7
      - name: Show server log after failure
        if: failure()
        run: tail -n 200 /tmp/pcc-e2e.log
